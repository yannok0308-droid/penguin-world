<body>

    <!-- ========================= -->
    <!-- PENGUIN WORLD 大門 -->
    <!-- ========================= -->

    <div class="game-screen">

        <div class="scene-container">

            <!-- 大門 -->
            <img
                id="gate-image"
                src="Image/企鵝世界 - 大門.png"
                class="scene"
                alt="Penguin World Gate"
            >

            <!-- 迎接企鵝 -->
            <img
                id="welcome-penguin"
                src="Image/迎接企鵝.png"
                class="welcome-penguin hidden-penguin"
                alt="迎接企鵝"
            >
<!-- 迎接企鵝對話 -->
<img
    id="welcome-dialogue"
    src="Image/welcoming - 1.png"
    class="welcome-dialogue hidden-dialogue"
    alt="迎接企鵝對話"
>

<!-- 我準備好啦 Button -->
<img
    id="ready-button"
    src="Image/Im Ready!.png"
    class="ready-button hidden-ready"
    alt="我準備好啦"
>

<!-- Scanner 隱形 Hotspot -->
<button
    id="scanner"
    class="hotspot"
    aria-label="Scan Special Pass">
</button>

        </div>

    </div>

         alt="重新探索警告">

         class="restart-panel restart-panel-3"

    <div class="restart-1-back"></div>

    <!-- 第三頁 hotspots -->

    <div class="restart-3-back"></div>
